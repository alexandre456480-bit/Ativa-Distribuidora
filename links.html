<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATIVA | Links</title>
    <meta name="description" content="Todos os links da ATIVA Distribuidora de Hortifruti em Goiânia. WhatsApp, Instagram, localização e site oficial.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://ativadistribuidora.sbs/links">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ========== RESET ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== BACKGROUND & BODY ========== */
        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            background: linear-gradient(160deg, #0a2463 0%, #1e56a0 35%, #3a7bd5 65%, #0d3b66 100%);
            position: relative;
        }

        /* ========== BACKGROUND FOSCO + ÍCONES ========== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 60, 0.35);
            backdrop-filter: blur(1px);
            z-index: 0;
        }

        .bg-icons {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.10;
        }

        .bg-icons .bg-icon {
            position: absolute;
            width: clamp(28px, 5vw, 48px);
            height: clamp(28px, 5vw, 48px);
            animation: floatIcon 18s infinite ease-in-out;
            color: rgba(255, 255, 255, 1);
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-18px) rotate(8deg); }
            50% { transform: translateY(8px) rotate(-5deg); }
            75% { transform: translateY(-10px) rotate(3deg); }
        }

        /* ========== CONTAINER PRINCIPAL ========== */
        .linktree {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 48px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-height: 100dvh;
        }

        /* ========== LOGO ========== */
        .linktree__logo {
            width: 180px;
            height: auto;
            object-fit: contain;
            animation: fadeInDown 0.6s ease-out;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
        }

        /* ========== TEXTOS ========== */
        .linktree__name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            margin-top: 16px;
            animation: fadeInDown 0.7s ease-out;
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        .linktree__desc {
            font-size: 0.92rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            line-height: 1.5;
            max-width: 300px;
            animation: fadeInDown 0.8s ease-out;
        }

        /* ========== ÍCONES SOCIAIS ========== */
        .linktree__socials {
            display: flex;
            gap: 20px;
            margin: 20px 0 8px;
            animation: fadeInDown 0.9s ease-out;
        }

        .social-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: scale(1.12) translateY(-3px);
        }

        .social-icon--whatsapp {
            background: #25D366;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        }

        .social-icon--whatsapp:hover {
            box-shadow: 0 6px 28px rgba(37, 211, 102, 0.6);
        }

        .social-icon--instagram {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 4px 20px rgba(220, 39, 67, 0.4);
        }

        .social-icon--instagram:hover {
            box-shadow: 0 6px 28px rgba(220, 39, 67, 0.6);
        }

        .social-icon svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        /* ========== BOTÕES ========== */
        .linktree__buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
            animation: fadeInUp 1s ease-out;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            background: #fff;
            border: none;
            color: #1a1a2e;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .link-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        }

        .link-btn:active {
            transform: translateY(0);
        }

        .link-btn svg,
        .link-btn i {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* ========== FOOTER ========== */
        .linktree__footer {
            margin-top: auto;
            padding-top: 32px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            animation: fadeInUp 1.1s ease-out;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 380px) {
            .linktree {
                padding: 36px 18px 32px;
            }
            .linktree__logo {
                width: 150px;
            }
            .linktree__name {
                font-size: 1.2rem;
            }
            .link-btn {
                padding: 14px 16px;
                font-size: 0.93rem;
            }
        }

        @media (min-width: 500px) {
            .linktree {
                min-height: auto;
                padding: 56px 32px 48px;
                margin: 40px 0;
                border-radius: 28px;
                background: rgba(255, 255, 255, 0.04);
                backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        }
    </style>
</head>
